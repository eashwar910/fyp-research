    what: "Define bucket 3."
    resolved: true
    resolution: >
      bucket_3 = "standout": any agri/agri-food project with very high potential
      to stand out — unique and catchy. No region or sensor/sub-field constraint.
      Encoded as bucket_exemptions.standout (skips C1, C2; adds hard C11_standout).
  - id: T2
    what: "Decide whether Malaysia joins C2_region."
    resolved: true
    resolution: >
      Yes. Malaysia added to C2 with sensor_rules.malaysia; C1 applies to it;
      indoor/vertical excluded for it like EU/India.
